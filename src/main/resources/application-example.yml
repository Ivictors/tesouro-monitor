# Exemplo para desenvolvimento local. Copie para application.yml (ignorado pelo Git).
server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: tesouro-monitor
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:tesourodb
    driver-class-name: org.h2.Driver
    username: sa
    password: MOCK_ONLY
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

tesouro:
  api:
    base-url: ${TESOURO_API_BASE_URL:https://www.tesourotransparente.gov.br}
    titulos-path: ${TESOURO_API_TITULOS_PATH:/ckan/dataset/df56aa42-484a-4a59-8184-7676580c81e3/resource/796d2059-14e9-44e3-80c9-2d9e30b405c1/download/precotaxatesourodireto.csv}
    connection-timeout-ms: ${TESOURO_API_CONNECTION_TIMEOUT_MS:3000}
    response-timeout-seconds: ${TESOURO_API_RESPONSE_TIMEOUT_SECONDS:30}
    max-in-memory-mb: ${TESOURO_API_MAX_IN_MEMORY_MB:32}
  scheduler:
    zone: ${TESOURO_SCHEDULER_ZONE:America/Sao_Paulo}
  monitoramento:
    limite-agio-percentual: ${TESOURO_LIMITE_AGIO_PERCENTUAL:5.00}
