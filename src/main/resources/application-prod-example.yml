# Exemplo do perfil prod. Configure credenciais verdadeiras fora do repositorio.
server:
  address: 127.0.0.1
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tesourodb}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
