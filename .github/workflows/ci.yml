name: Validar aplicação

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Testar backend e migrações PostgreSQL
        run: mvn --batch-mode verify

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Testar frontend
        working-directory: frontend
        run: npm test

      - name: Gerar build do frontend
        working-directory: frontend
        run: npm run build
